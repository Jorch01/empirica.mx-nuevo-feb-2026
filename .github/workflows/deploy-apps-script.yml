name: Desplegar Apps Script

# Sube cada proyecto de apps-script/<proyecto>/ a Google Apps Script, actualiza
# su web app (la URL no cambia) y, si un proyecto todavía no tiene web app, la
# crea y publica su URL en js/apps-script-urls.js. Un proyecto nuevo solo
# necesita su carpeta y el secret APPS_SCRIPT_<PROYECTO>_ID: no hay que tocar
# este archivo. Configuración única en apps-script/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'
      - '.github/scripts/desplegar-apps-script.mjs'
  workflow_dispatch:

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

permissions:
  contents: write   # para publicar js/apps-script-urls.js

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - name: Revisar configuración
        id: check
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::notice::Falta el secret CLASPRC_JSON; no se despliega nada (ver apps-script/README.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-node@v5
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: '22'

      - name: Preparar clasp
        if: steps.check.outputs.skip != 'true'
        run: |
          npm install -g @google/clasp@3.4.1
          # CLASPRC_JSON puede venir como JSON o en base64 (más seguro de copiar)
          CREDS=$(printf '%s' "$CLASPRC_JSON" | tr -d '\r')
          case "$(printf '%s' "$CREDS" | tr -d '[:space:]' | cut -c1)" in
            '{') printf '%s' "$CREDS" > ~/.clasprc.json ;;
            *)   printf '%s' "$CREDS" | tr -d '[:space:]' | base64 -d > ~/.clasprc.json 2>/dev/null || true ;;
          esac
          if ! node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' ~/.clasprc.json 2>/dev/null; then
            echo "::error::El secret CLASPRC_JSON no es válido (se cortó o alteró al copiarlo). Vuelve a generarlo con: base64 -w0 ~/.clasprc.json (ver apps-script/README.md)."
            exit 1
          fi

      - name: Desplegar cada proyecto
        if: steps.check.outputs.skip != 'true'
        env:
          # El script busca APPS_SCRIPT_<PROYECTO>_ID y _DEPLOYMENT_ID de cada carpeta.
          SECRETOS: ${{ toJSON(secrets) }}
        run: node .github/scripts/desplegar-apps-script.mjs

      - name: Publicar las URL en el sitio
        # También si un proyecto falló: las URL de los demás deben quedar publicadas.
        if: always() && steps.check.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- js/apps-script-urls.js)" ]; then
            echo "Las URL publicadas no cambiaron."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/apps-script-urls.js
          git commit -m "Apps Script: URL de las web apps"
          for intento in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "::warning::No se pudo publicar js/apps-script-urls.js. Pégalo tal cual en el repositorio:"
          cat js/apps-script-urls.js

      - name: Limpiar credenciales
        if: always()
        run: rm -f ~/.clasprc.json
