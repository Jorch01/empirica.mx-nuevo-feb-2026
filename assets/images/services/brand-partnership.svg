<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b22;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#1c2b36;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3040;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8a96e;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#c8a96e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8a96e;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#243545;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2d3a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="100" r="160" fill="#c8a96e" fill-opacity="0.04"/>
  <circle cx="680" cy="400" r="140" fill="#c8a96e" fill-opacity="0.05"/>
  <circle cx="400" cy="250" r="200" fill="none" stroke="#c8a96e" stroke-width="0.5" stroke-opacity="0.08"/>
  <circle cx="400" cy="250" r="280" fill="none" stroke="#c8a96e" stroke-width="0.5" stroke-opacity="0.05"/>

  <!-- Central connection line -->
  <line x1="160" y1="250" x2="640" y2="250" stroke="url(#goldLine)" stroke-width="1.5" opacity="0.5"/>

  <!-- Central handshake / connection node -->
  <circle cx="400" cy="250" r="40" fill="#1c2b36" stroke="#c8a96e" stroke-width="2" stroke-opacity="0.6" filter="url(#glow2)"/>
  <!-- Link/handshake icon in center -->
  <path d="M385 242 L395 252 L415 232" fill="none" stroke="#c8a96e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M385 258 L395 268 L415 248" fill="none" stroke="#c8a96e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Left card (Creator/Talent) -->
  <rect x="60" y="170" width="200" height="160" rx="12" fill="url(#cardGrad)" stroke="#c8a96e" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Person icon -->
  <circle cx="160" cy="210" r="22" fill="none" stroke="#c8a96e" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="160" cy="204" r="8" fill="#c8a96e" fill-opacity="0.5"/>
  <path d="M138 224 Q160 214 182 224" fill="none" stroke="#c8a96e" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Star badge -->
  <path d="M155 237 L157 243 L163 243 L158 247 L160 253 L155 249 L150 253 L152 247 L147 243 L153 243 Z"
        fill="#c8a96e" opacity="0.8" filter="url(#glow2)"/>
  <!-- Label -->
  <rect x="80" y="285" width="160" height="28" rx="6" fill="#c8a96e" fill-opacity="0.1" stroke="#c8a96e" stroke-width="1" stroke-opacity="0.3"/>
  <text x="160" y="304" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c8a96e" opacity="0.85" text-anchor="middle">Talento Digital</text>
  <!-- Metrics -->
  <text x="100" y="320" font-family="Arial, sans-serif" font-size="10" fill="#c8a96e" opacity="0.5">♥ 45K</text>
  <text x="155" y="320" font-family="Arial, sans-serif" font-size="10" fill="#c8a96e" opacity="0.5">▶ 128K</text>

  <!-- Right card (Brand) -->
  <rect x="540" y="170" width="200" height="160" rx="12" fill="url(#cardGrad)" stroke="#c8a96e" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Building/brand icon -->
  <rect x="618" y="190" width="44" height="50" rx="3" fill="none" stroke="#c8a96e" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="626" y="198" width="10" height="10" rx="1" fill="#c8a96e" opacity="0.4"/>
  <rect x="642" y="198" width="10" height="10" rx="1" fill="#c8a96e" opacity="0.4"/>
  <rect x="626" y="214" width="10" height="10" rx="1" fill="#c8a96e" opacity="0.4"/>
  <rect x="642" y="214" width="10" height="10" rx="1" fill="#c8a96e" opacity="0.4"/>
  <rect x="632" y="228" width="16" height="12" rx="1" fill="#c8a96e" opacity="0.5"/>
  <path d="M608 190 L640 172 L672 190" fill="none" stroke="#c8a96e" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Label -->
  <rect x="560" y="285" width="160" height="28" rx="6" fill="#c8a96e" fill-opacity="0.1" stroke="#c8a96e" stroke-width="1" stroke-opacity="0.3"/>
  <text x="640" y="304" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c8a96e" opacity="0.85" text-anchor="middle">Marca / Anunciante</text>
  <!-- Budget icon -->
  <text x="580" y="320" font-family="Arial, sans-serif" font-size="10" fill="#c8a96e" opacity="0.5">$ Presupuesto</text>
  <text x="635" y="320" font-family="Arial, sans-serif" font-size="10" fill="#c8a96e" opacity="0.5">↗ ROI</text>

  <!-- Connection dots on the line -->
  <circle cx="265" cy="250" r="4" fill="#c8a96e" opacity="0.7"/>
  <circle cx="310" cy="250" r="3" fill="#c8a96e" opacity="0.5"/>
  <circle cx="355" cy="250" r="3" fill="#c8a96e" opacity="0.5"/>
  <circle cx="445" cy="250" r="3" fill="#c8a96e" opacity="0.5"/>
  <circle cx="490" cy="250" r="3" fill="#c8a96e" opacity="0.5"/>
  <circle cx="535" cy="250" r="4" fill="#c8a96e" opacity="0.7"/>

  <!-- Document/contract icon floating top-center -->
  <g transform="translate(365, 80)" filter="url(#glow2)" opacity="0.75">
    <rect x="0" y="0" width="70" height="90" rx="5" fill="none" stroke="#c8a96e" stroke-width="2"/>
    <rect x="8" y="20" width="54" height="4" rx="2" fill="#c8a96e" opacity="0.5"/>
    <rect x="8" y="32" width="40" height="4" rx="2" fill="#c8a96e" opacity="0.4"/>
    <rect x="8" y="44" width="48" height="4" rx="2" fill="#c8a96e" opacity="0.4"/>
    <rect x="8" y="56" width="35" height="4" rx="2" fill="#c8a96e" opacity="0.3"/>
    <!-- Pen stroke -->
    <path d="M40 72 L56 72 L60 68 L52 60 L40 72 Z" fill="#c8a96e" opacity="0.6"/>
    <rect x="20" y="4" width="30" height="10" rx="3" fill="#c8a96e" opacity="0.5"/>
    <text x="20" y="12" font-family="Arial" font-size="8" fill="#1c2b36" font-weight="bold">CONTRATO</text>
  </g>
  <line x1="400" y1="170" x2="400" y2="210" stroke="#c8a96e" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,3"/>

  <!-- Grid dots bottom right -->
  <g opacity="0.07">
    <circle cx="660" cy="130" r="2" fill="#c8a96e"/>
    <circle cx="700" cy="130" r="2" fill="#c8a96e"/>
    <circle cx="740" cy="130" r="2" fill="#c8a96e"/>
    <circle cx="660" cy="160" r="2" fill="#c8a96e"/>
    <circle cx="700" cy="160" r="2" fill="#c8a96e"/>
    <circle cx="740" cy="160" r="2" fill="#c8a96e"/>
  </g>

  <!-- Label tag -->
  <rect x="30" y="430" width="220" height="40" rx="4" fill="#c8a96e" opacity="0.12"/>
  <rect x="30" y="430" width="4" height="40" rx="2" fill="#c8a96e" opacity="0.8"/>
  <text x="44" y="455" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c8a96e" opacity="0.9">Conexión Marca · Talento</text>
</svg>
